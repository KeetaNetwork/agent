name: Signet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Everything but the Secure Enclave, against the real OpenSSH and git tools.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends openssh-client git
      - run: swift test --parallel

  # The same tests on a Mac, and the Secure Enclave key compiled. SignetKit's tests are Swift
  # Testing, so XCTest is skipped; a run that takes over five minutes is stuck, so the job prints
  # where each thread of the test process is waiting, and fails.
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - name: swift test
        run: |
          swift test --skip-build --disable-xctest > test.log 2>&1 &
          pid=$!
          for _ in $(seq 300); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            cat test.log
            ps -axo pid,ppid,stat,etime,command | grep -v ' ps -axo'
            tests=$(pgrep -f SignetKitPackageTests | head -1)
            descendants() { for c in $(pgrep -P "$1"); do echo "$c"; descendants "$c"; done; }
            for c in $(descendants "$tests"); do
              echo "::group::process $c"
              ps -o pid,stat,command -p "$c" || true
              lsof -p "$c" || true
              sample "$c" 1 -mayDie -file /dev/stdout | sed -n '/^Call graph/,/^Total number/p' || true
              echo "::endgroup::"
            done
            sample "$tests" 2 -mayDie -file /dev/stdout | sed -n '/^Call graph/,/^Total number/p' || true
            exit 1
          fi
          cat test.log
          wait "$pid"

  # The Signet app builds on SignetKit (unsigned: signing needs the team's certificate).
  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project Agent.xcodeproj -scheme Agent -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO build
      # The release workflow's signing, ad hoc since CI has no certificate: notarization refuses an
      # app unless every Mach-O file in it is signed with the hardened runtime, and Signet finds its
      # Secure Enclave key only through the keychain group in its entitlements.
      - name: Sign the app the way a release does
        run: |
          app="$RUNNER_TEMP/build/Build/Products/Release/Agent.app"
          scripts/sign-app.sh "$app" -
          codesign --verify --deep --strict --verbose=2 "$app"
          unsigned=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            if ! codesign -dv "$f" 2>&1 | grep -q 'flags=.*runtime'; then
              echo "::error::Not signed with the hardened runtime: ${f#$app/}"
              unsigned=1
            fi
          done < <(find "$app" -type f -print0)
          [ "$unsigned" = 0 ]
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist"
          plutil -extract keychain-access-groups.0 raw "$RUNNER_TEMP/entitlements.plist" | grep -qx '2BG69HN56W.com.keeta.agent'
          plutil -extract com.apple.application-identifier raw "$RUNNER_TEMP/entitlements.plist" | grep -qx '2BG69HN56W.com.keeta.agent'
